# Проверки на каждый коммит.
#
# Раньше в CI не гонялось ничего: пайплайн собирал _site и выкатывал его, а
# всё, чем проверяют плату, оставалось на машине того, кто правит. Поэтому
# поломка доезжала до продакшена ровно так же быстро, как правка.
#
# Разнесено на две работы по одной причине — по времени. Быстрая не поднимает
# браузер вовсе и отвечает за полторы секунды; браузерная ставит chromium и
# меряет, и держать их вместе значило бы ждать браузер ради опечатки в
# паспорте машины.
#
# Экшены прибиты полным хэшем коммита, а не тегом: тег владелец может
# передвинуть на другой код. Версия в комментарии — для чтения, обновляет
# пины Dependabot. Тот же принцип, что в security.yml и deploy.yaml.
name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  # Отменяем на ходу, в отличие от выкатки: здесь нечего оставлять в
  # промежуточном состоянии, а очередь из десяти прогонов на десять пушей
  # никому не нужна.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: без браузера
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Номер ревизии платы — это число коммитов, тронувших index.html, а
          # номер детали — хэш последнего коммита по её файлу. Мелкого клона
          # для них не хватает, и пересборка вышла бы другой.
          fetch-depth: 0

      # Юнит-тесты, слои платы и проверка подписей. Ни одному из них не нужен
      # ни браузер, ни сеть: они разбирают то, что генератор собрал в памяти,
      # и то, что уже лежит в репозитории.
      - name: Тесты
        run: python3 -m unittest discover -s tests -t tests -v

      # Наслоения сверяются с базой tools/layers.json. Падение здесь означает
      # не «плата плохая», а «стало хуже, чем было в базе».
      - name: Слои платы
        run: python3 tools/layers.py


      # Заголовки безопасности объявлены в _headers, а политика собирается по
      # хэшам встроенных скриптов. Разъедутся молча: страница откроется, а
      # браузер перестанет выполнять её же скрипты.
      - name: Заголовки безопасности
        run: node tools/security-headers.mjs

      # Разбор подписей читает tools/board-v17.svg.part, а его в репозитории
      # нет и быть не должно: это второй экземпляр того, что уже лежит между
      # метками в index.html. Поэтому сначала сборка — она же и проверяется на
      # детерминированность, — и только потом разбор.
      #
      # Генератор обязан быть детерминированным: рассыпуха раскладывается
      # обходом, краска сливается, места раздаются в порядке сборки — любая
      # случайность без посева или зависимость от времени всплыла бы тем, что
      # схема тихо ездит от сборки к сборке, а сверка картинки начала бы врать.
      #
      # Сверять пересборку с закоммиченной страницей нельзя, и это выяснилось
      # измерением: номер ревизии — счётчик коммитов, номер детали — хэш
      # последнего коммита по её файлу, серийный номер — отпечаток разметки, в
      # которую входит номер ревизии, а штрих-коды на наклейках сосчитаны из
      # серийного номера. Автор собирает страницу ДО коммита, CI пересобрал бы
      # ПОСЛЕ — и все четыре разошлись бы всегда, ничего не сломав.
      - name: Сборка детерминирована
        run: |
          python3 tools/build.py > /dev/null
          cp index.html /tmp/build-1.html
          python3 tools/build.py > /dev/null
          if ! diff -q /tmp/build-1.html index.html > /dev/null; then
            echo "::error::две сборки подряд разошлись — в генераторе есть недетерминизм"
            diff /tmp/build-1.html index.html | head -20
            exit 1
          fi

      - name: Подписи не наехали
        run: python3 tools/audit_text.py

  browser:
    name: в браузере
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Лента ревизий собирается из истории самой страницы, коммит за
          # коммитом: мелкого клона не хватает.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: '24'

      # Свой chromium playwright скачивает сам. В контейнере разработки так
      # нельзя — там нет libglib-2.0 и браузер берётся из nix, — но здесь
      # обычная ubuntu, и работает как раз обратное. Разбирается с этим
      # tools/browser.mjs, ему всё равно, где браузер нашёлся.
      # Зависимости проверок закреплены файлом блокировки в tools/ci — вместе
      # с транзитивными, которых пин версии не держит. Без него красная
      # проверка означала бы «сегодня вышел новый playwright», а не «страница
      # сломалась».
      #
      # Сам сайт от этого не зависит ничем: у него нет ни сборки, ни
      # node_modules, и package.json лежит в стороне, в tools/ci, чтобы это
      # оставалось правдой.
      # Двумя шагами, а не одним: пакеты и браузер ставятся по-разному и
      # ломаются по-разному, а слитые в один шаг они отчитываются одной
      # красной строкой, по которой не видно, что именно не встало.
      #
      # working-directory вместо --prefix: у `npm ci --prefix` конфиг и
      # файл блокировки берутся из разных мест, и в чужом окружении это
      # расходится молча.
      - name: Поставить зависимости проверок
        working-directory: tools/ci
        run: npm ci

      # Свой браузер playwright скачивает сам; --with-deps доставляет
      # системные библиотеки, которых на чистой ubuntu нет.
      - name: Поставить браузер
        working-directory: tools/ci
        run: npx playwright install --with-deps chromium


      # Лента ревизий в репозитории не лежит — она второй экземпляр того, что
      # уже есть в коммитах. Без неё три сценария поведения падают на пустом
      # месте: `revisions on` поднимать нечего.
      - name: Собрать ленту ревизий
        run: python3 tools/history.py

      # Карточка: то, что видит гость с телефона. Схемы там нет вовсе, и все
      # остальные проверки смотрят мимо неё.
      - name: Карточка на телефоне
        run: node tools/mobile.mjs

      # Анимации карточки: наведение, ступенчатое появление, выключение
      # движения. Ломаются они молча — правило с той же специфичностью ниже по
      # файлу отбирает переход, и наведение начинает срабатывать мгновенно.
      - name: Анимации карточки
        run: node tools/anim.mjs

      - name: Доступность
        run: node tools/a11y.mjs

      - name: Поведение машины
        run: node tools/behave.mjs

      # Воркер поднимается по-настоящему, тем же wrangler: метка версии на
      # странице, отказы на приёме мерок и то, что политика не отвергает
      # собственные скрипты.
      - name: Воркер
        run: node tools/rum-check.mjs

      # --ci: бюджеты по времени тут не применяются — секунды раннера не наши.
      # Вес по проводу и работа кэша от машины не зависят и проверяются.
      - name: Скорость и кэш
        run: node tools/perf-matrix.mjs --ci

      # Здесь, наоборот, время меряется — но не в секундах раннера, а в его же
      # собственных долях: сцена в работе против той же сцены с погашенными
      # анимациями. Обе половины снимаются на одной машине подряд, поэтому
      # число переносится с ноутбука на раннер, а порог не приходится
      # подгонять под чужое железо.
      - name: Плавность схемы
        run: node tools/perf-attrib.mjs --quick
