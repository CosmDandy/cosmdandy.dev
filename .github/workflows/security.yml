# Baseline security gates. All actions are pinned by full commit SHA and not by
# tag: a tag can be moved by the action's owner onto different code. This is
# not paranoia — in March 2026 trivy-action had 75 of its 76 version tags
# rewritten by a force-push, and pipelines on `@v0.x` started exfiltrating
# secrets. The version in the comment is for readability, updating the pins is
# automated by Dependabot.
name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Once a week: new CVEs and rules appear without any commits to the repo.
    - cron: "0 6 * * 1"

# Empty at the workflow level — every job requests its permissions explicitly
# and minimally.
permissions: {}

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed by the next commit stays in it forever.
          fetch-depth: 0
          # By default checkout writes the token into .git/config, where any
          # following step can read it. Here it is not needed.
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: iac (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload SARIF to the Security tab (free for public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # trivy config replaces tfsec (folded into trivy) and terrascan (archived
      # 2025-11-20). Covers Terraform, Kubernetes, Helm, Dockerfile, Ansible.
      #
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          hide-progress: true

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          hide-progress: true
      - uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        if: always()
        # In private repos without GHAS the SARIF upload is unavailable — do
        # not bring the job down.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

  workflows:
    name: workflow configs (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The niche of "security of the CI configs themselves" is covered by
      # neither trivy nor checkov. zizmor catches unpinned uses:, template
      # injection, pwn-request through pull_request_target, excessive
      # permissions, credentials leaking into artifacts.
      #
      # The action uploads findings into the Security tab, but does NOT bring
      # the job down: it has no "fail on findings" input at all. Hence the gate
      # is a separate step below.
      #
      # continue-on-error: in a private repository without GHAS the SARIF
      # upload into code scanning is unavailable, and the action fails on it.
      # That is a problem of delivering the report, not a finding — blocking
      # because of it is not allowed, otherwise the gate below would not run at
      # all (a step after a failed one is skipped).
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        continue-on-error: true

      # The real gate: the CLI returns 14 on findings and 0 on a clean config.
      # The medium threshold — informational (a template-injection with low
      # confidence, for example) does not bring CI down, everything else does.
      # The version is pinned for the same reason actions are pinned by SHA:
      # reproducibility of the run.
      - name: zizmor (gate)
        run: pipx run zizmor==1.28.0 --offline --min-severity=medium .
