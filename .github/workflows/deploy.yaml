# Delivering the personal card to Cloudflare Workers.
#
# The site used to be published by GitHub Pages straight from the branch, with
# no pipeline at all: the static files live in the repository root. Now the
# same set of files is assembled into _site/ and uploaded to the worker —
# Pages is no longer involved on this domain.
#
# Same principle as in security.yml: actions are pinned by full commit SHA and
# not by tag — a tag can be moved by the action's owner onto different code.
# The version in the comment is for readability, Dependabot updates the pins.
name: deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Empty at the workflow level — every job requests its permissions explicitly
# and minimally.
permissions: {}

concurrency:
  # We do not cancel in flight: an interrupted deploy would leave the worker in
  # an intermediate state. The queue can wait, there is next to nothing to
  # build here.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By default checkout leaves the token in .git/config, where any
          # following step can read it.
          persist-credentials: false
          # Лента ревизий собирается из истории самой страницы, коммит за
          # коммитом, — мелкого клона для этого не хватает.
          fetch-depth: 0

      # Лента ревизий раскладывается по файлам здесь же, из git. В репозитории
      # их нет и быть не должно: это второй экземпляр того, что уже лежит в
      # коммитах, — поэтому history/ в .gitignore, а собирается он на каждой
      # сборке заново.
      #
      # Раньше лента была инструментом разработки и наружу не ездила. Теперь
      # ездит: посмотреть, как машина росла, — часть того, ради чего визитка и
      # сделана. Гость за это не платит ничем, пока не попросит: автозагрузка
      # включена только на localhost, на живом сайте ленту поднимают командой
      # `revisions on`, и тогда качается по одной схеме — около 77 КБ gzip.
      - name: Build board history
        run: python3 tools/history.py

      # We copy an explicit list rather than "everything except the internals":
      # the list is short and springs no surprises when a new file shows up in
      # the repository root.
      #
      # CNAME is deliberately not copied — it was needed by GitHub Pages, while
      # on Cloudflare the domain is bound to the worker in the dashboard.
      - name: Build _site
        run: |
          mkdir -p _site
          cp index.html 404.html style.css server.css server.js _site/
          cp robots.txt sitemap.xml site.webmanifest _headers _site/
          cp -r assets fonts _site/
          cp -r history _site/
          # Страница /tg целиком лежит в своей директории и копируется как есть.
          cp -r tg _site/
          echo "Contents of _site:"
          find _site -type f -not -path '_site/history/*' | sort
          echo "Revisions: $(find _site/history -name '*.svg' | wc -l) files," \
               "$(du -sh _site/history | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site/
          retention-days: 7

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://cosmdandy.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only wrangler.jsonc is needed, no history required.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site/

      # На продакшене отметки нет — этим он и отличается от стендов. Но просто
      # не ставить её нельзя: в закоммиченной странице лежит штамп локальной
      # сборки, и без стирания на продакшен уехало бы «локально».
      - name: Clear build stamp
        run: python3 tools/stamp_build.py _site/index.html _site/404.html --clear

      # Отладочные слои — границы занятости, наслоения и координатная сетка —
      # нужны только тому, кто правит плату. Панель, которой они переключаются,
      # на продакшен и так не попадает: она появляется по отметке о сборке, а
      # её только что стёрли. Сами слои — часть разметки, и уезжали всегда:
      # 1 435 элементов и 105 КБ, 23 % фигур схемы.
      #
      # Режется здесь, а не в генераторе, потому что _site собирается один раз
      # на оба стенда: только тут известно, что стенд — продакшен. На превью
      # слои остаются, там они и нужны.
      - name: Strip debug layers
        run: python3 tools/strip_debug.py _site/index.html

      # Secrets cannot be checked in if: — the secrets context is not available
      # there. Without this step a missing token looks like an inscrutable
      # error inside wrangler, and it is unclear whether the deploy broke or
      # the access was never set up.
      - name: Check Cloudflare access
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not set: $missing. Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  preview:
    name: preview
    needs: build
    # Only for PRs from this same repository: a branch from a fork does not get
    # the secrets, and that is right. Dependabot is excluded separately — its
    # PRs look internal, but it receives secrets from its own store and not
    # from Actions, so a preview would not have built for it anyway.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The preview address is posted as a comment on the PR itself. Otherwise
      # one has to dig it out of the run summary, while the point of looking at
      # it is to follow a link from the discussion.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site/

      # Отметка о сборке ставится здесь, а не в сборке: артефакт один на оба
      # стенда, и «где развёрнуто» знает только тот, кто развёртывает. Заодно
      # это единственное место, где известен настоящий коммит: index.html лежит
      # в репозитории уже собранным, и хэш от генератора был бы предыдущим.
      - name: Stamp build
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/stamp_build.py _site/index.html _site/404.html \
            --env cloudflare --sha "$SHA" --ref "$REF" --pr "$PR"

      # versions upload and not deploy: a new version of the worker is uploaded
      # with its own preview address, while production keeps serving the
      # current one.
      - id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          # grep with no match returns one, and the assignment would bring the
          # step down: bash is run here with -e.
          url=$(printf '%s' "$OUTPUT" \
            | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -z "$url" ]; then
            url="address not found in wrangler output"
          fi
          {
            echo "### Preview of this version"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
          # Through printf and not a multiline quoted string: inside a YAML
          # block the second line would keep an indent of ten spaces, and for
          # markdown that already means a code block.
          body=$(printf \
            'Preview: %s\n\nBuilt from `%s`. Production serves the current version.' \
            "$url" "$SHA")
          # We edit our own previous comment instead of breeding a new one on
          # every push: the discussion should keep a single address — the
          # current one.
          gh pr comment "$PR" --body "$body" --edit-last \
            || gh pr comment "$PR" --body "$body"
