# SHA pins do not update themselves — that is Dependabot's job: it raises a PR
# with the new SHA and fixes up the version comment next to it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A pause before updating: most supply-chain attacks on packages and
    # actions are uncovered in the first days, so fresh releases are not pulled
    # in right away.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
