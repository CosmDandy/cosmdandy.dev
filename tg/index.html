<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // До отрисовки, иначе на долю секунды мелькнёт не та тема. Ключ тот же,
        // что на визитке: тема выбирается один раз на весь сайт, и переход сюда
        // не должен её сбрасывать.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', saved || system);
        })();
    </script>
    <title>Telegram — cosmdandy</title>
    <meta name="description" content="Написать Тимофею Кондрашину в Telegram: @cosmdandy. Прямая ссылка на личные сообщения, хендл для копирования и QR-код.">

<body>

<!-- Путь назад. Ссылка, а не кнопка с историей: на страницу попадают не только
     с визитки — по прямому адресу, из QR, из чужого сообщения, — и «назад» у
     такого гостя вело бы наружу сайта или никуда. Здесь адрес известен всегда,
     а тем, кто пришёл переездом, браузер и так вернёт кнопкой назад. -->

</a>

<div class="dots"></div>

<main>

                <path d="M8.3 14.4l9.2-7.8"/>

        <!-- Строка набрана ровно так же, как на визитке: те же два элемента с
             теми же размерами и порядком. На них держится переход между
             страницами — браузер сопоставляет их по имени и переносит сам,
             а не показывает две разные шапки подряд. Хендл отсюда ушёл вниз,
             на кнопку копирования: имя человека важнее его логина, и на обеих
             страницах в этом месте должно стоять одно и то же. -->
        <h1>Timofey Kondrashin</h1>
        <p class="bio">DevOps Engineer</p>
        <p class="now"><span class="live-dot"></span>личные сообщения открыты</p>

        <nav class="links">
            <!-- Главная кнопка уходит прямо в приложение. Тот, кто пришёл сюда
                 писать, Telegram себе уже поставил, и лишняя остановка на чужой
                 странице ему ни к чему. Навигации при этом не происходит: схему
                 забирает система, страница остаётся на месте — так что если
                 приложения нет и ничего не открылось, человек никуда не улетел
                 и видит запасной путь на t.me в подвале. Тем же приёмом
                 пользуется и сам Telegram на своих страницах. -->
            <a href="tg://resolve?domain=cosmdandy" class="link-item primary" id="open-tg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 4.4L2.4 11.5c-.6.2-.6 1.1.1 1.3l4.8 1.6 1.8 5.8c.2.5.8.7 1.2.4l2.7-2.2 5.3 3.9c.5.4 1.2.1 1.3-.5L22.8 5.5c.2-.7-.5-1.4-1.6-1.1z"/><path d="M8.3 14.4l9.2-7.8"/></svg>
                <span>Написать в Telegram</span>
                <svg class="hint-arrow" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10 L10 2 M4 2 H10 V8"/></svg>
            </a>

            <button class="link-item" id="copy-btn" type="button" data-copy="@cosmdandy">
                <span class="icon-slot">
                    <svg class="ic-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <svg class="ic-done" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
                </span>
                <span id="copy-label">Скопировать хендл</span>
                <span class="hint" id="copy-hint">@cosmdandy</span>
            </button>
        </nav>

        <!-- Код виден сразу, без кнопки: страницу открывают с одной мыслью —
             написать, — и код это второй способ сделать то же самое, а не
             дополнительный материал, ради которого стоит куда-то нажимать. -->
        <div class="qr-panel">
            <div class="qr-paper">
                <svg viewBox="0 0 29 29" aria-label="QR-код на t.me/cosmdandy">
                    <path d="M2 2.5h7m1 0h3m1 0h3m3 0h7m-25 1h1m5 0h1m3 0h1m1 0h1m1 0h1m1 0h1m1 0h1m5 0h1m-25 1h1m1 0h3m1 0h1m1 0h2m3 0h3m2 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m3 0h1m1 0h4m2 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m2 0h2m2 0h2m3 0h1m1 0h3m1 0h1m-25 1h1m5 0h1m1 0h1m2 0h2m3 0h1m1 0h1m5 0h1m-25 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-16 1h1m4 0h2m-16 1h1m1 0h1m3 0h2m1 0h1m2 0h1m2 0h1m3 0h1m2 0h1m1 0h1m-22 1h1m4 0h2m2 0h2m1 0h2m1 0h1m2 0h1m1 0h2m-24 1h2m3 0h1m2 0h2m4 0h1m3 0h4m1 0h1m-25 1h1m1 0h1m1 0h1m6 0h2m2 0h2m1 0h2m1 0h1m-22 1h1m2 0h1m1 0h3m2 0h3m3 0h1m1 0h1m5 0h1m-23 1h3m2 0h2m3 0h1m2 0h2m1 0h2m3 0h2m-25 1h2m1 0h1m2 0h1m1 0h1m3 0h2m1 0h1m5 0h2m1 0h1m-22 1h1m3 0h2m1 0h3m2 0h1m1 0h1m1 0h3m-22 1h9m1 0h1m4 0h6m2 0h1m-16 1h2m3 0h2m1 0h1m3 0h1m3 0h1m-25 1h7m1 0h4m1 0h2m1 0h1m1 0h1m1 0h1m3 0h1m-25 1h1m5 0h1m3 0h1m3 0h3m3 0h1m3 0h1m-25 1h1m1 0h3m1 0h1m2 0h1m1 0h10m3 0h1m-25 1h1m1 0h3m1 0h1m5 0h1m2 0h3m2 0h1m1 0h2m-24 1h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h3m2 0h1m1 0h3m1 0h2m-25 1h1m5 0h1m3 0h3m3 0h2m1 0h2m-21 1h7m1 0h1m3 0h5m1 0h1m2 0h1m2 0h1" stroke="var(--qr-ink)" stroke-width="1" fill="none"/>
                </svg>
            </div>
            <p class="qr-caption">наведите камеру телефона</p>
        </div>
    </div>
</main>

<div class="meta">
    <!-- Адрес относительный: это тот же сайт, и обратный переход должен
         пройти таким же переездом, а не уходом на чужой хост. Заодно на
         стенде ссылка остаётся внутри стенда. -->
    <a href="/">cosmdandy.dev</a>
    <span class="sep">·</span>
    <a href="https://t.me/cosmdandy" id="fallback" target="_blank" rel="noopener">не открылось — перейти на t.me</a>
</div>

<script>
    var root = document.documentElement;

    // Атрибут к этому моменту уже стоит — его выставил скрипт в <head>, —
    // поэтому читаем его, а не опрашиваем систему второй раз. Ключ общий с
    // визиткой: тема выбирается один раз на весь сайт.
    document.getElementById('theme-btn').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // ── Живой фон ──────────────────────────────────────────────────────────
    // То же движение, что на визитке: сетка точек ходит за мышью на десяток
    // пикселей, а свечение тянется за курсором с отставанием. Само по себе
    // это почти незаметно — и в этом смысл: страница перестаёт выглядеть
    // картинкой, но ничего не требует к себе внимания.
    //
    // Оба значения догоняют цель долями, а не ставятся напрямую: у сетки доля
    // мелкая, потому её и ведёт заметно позже руки, у свечения крупнее. Один
    // кадровый цикл на двоих — второй requestAnimationFrame ради тех же
    // тридцати строк не нужен.
    var glow = document.getElementById('cursor-glow');
    var dots = document.querySelector('.dots');
    var fine = window.matchMedia('(pointer: fine)').matches;
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (fine && !still) {
        var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        var glowX = mouseX, glowY = mouseY;
        var dotsX = 0, dotsY = 0, dotsPos = '';

        window.addEventListener('mousemove', function (e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            glow.classList.add('visible');
        });

        (function frame() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            glow.style.left = glowX + 'px';
            glow.style.top = glowY + 'px';

            dotsX += ((mouseX / window.innerWidth - 0.5) * 10 - dotsX) * 0.05;
            dotsY += ((mouseY / window.innerHeight - 0.5) * 10 - dotsY) * 0.05;
            // Пишем только когда значение и правда изменилось: округление до
            // сотых даёт ту же картинку, но избавляет от записи в стиль на
            // каждом кадре, когда мышь уже стоит.
            var pos = dotsX.toFixed(2) + 'px ' + dotsY.toFixed(2) + 'px';
            if (pos !== dotsPos) {
                dotsPos = pos;
                dots.style.backgroundPosition = pos;
            }
            requestAnimationFrame(frame);
        })();
    } else if (fine) {
        window.addEventListener('mousemove', function (e) {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            glow.classList.add('visible');
        });
    }

    var copyBtn = document.getElementById('copy-btn');
    var copyLabel = document.getElementById('copy-label');
    var copyTimer = null;

    /* Запасной путь на execCommand нужен не для древних браузеров, а для
       случаев, когда navigator.clipboard есть, но отказывает: страница не на
       https, вкладка без фокуса, iframe без разрешения на буфер. Без него отказ
       был молчаливым — обещание отклонялось, и кнопка просто не отзывалась. */
    function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    function showCopied(ok) {
        copyBtn.classList.toggle('copied', ok);
        copyLabel.textContent = ok ? 'Скопировано' : 'Выделите и скопируйте вручную';
        clearTimeout(copyTimer);
        copyTimer = setTimeout(function () {
            copyBtn.classList.remove('copied');
            copyLabel.textContent = 'Скопировать хендл';
        }, ok ? 1800 : 2600);
    }

    copyBtn.addEventListener('click', function () {
        var text = copyBtn.dataset.copy;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
                function () { showCopied(true); },
                function () { showCopied(legacyCopy(text)); }
            );
        } else {
            showCopied(legacyCopy(text));
        }
    });

    // ── Приложение открывается само ────────────────────────────────────────
    // Сюда приходят с одной мыслью — написать, — и нажимать ради этого ещё
    // одну кнопку незачем: страница пробует отдать гостя приложению сразу.
    // Навигации при этом не происходит, схему tg:// забирает система, документ
    // остаётся на месте. Значит тому, у кого приложения нет, ничего не сломали:
    // он видит ту же страницу, кнопку, код и запасной путь на t.me.
    //
    // Один раз на вкладку. Вернувшись из приложения кнопкой «назад», гость
    // получил бы вторую попытку и снова уехал бы в приложение — из страницы
    // стало бы невозможно выйти.
    (function () {
        var KEY = 'tg-open-tried';
        var link = document.getElementById('open-tg');
        if (!link) return;
        try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
        } catch (err) {
            // Приватный режим: хранилища нет, попытка будет ровно одна — эта.
        }
        // Ждём, пока страница отрисуется. Уйти в приложение можно и с пустого
        // экрана, но если приложения не окажется, гость останется смотреть
        // именно на него.
        window.addEventListener('load', function () {
            setTimeout(function () { location.href = link.href; }, 140);
        });
    })();
</script>
</body>
