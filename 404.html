    <!-- Тема — одним файлом на весь сайт: и выключатель светлой, и выбор
         темы до первой отрисовки. Синхронно, иначе мелькнёт не та. -->
    <!-- THEME:BEGIN -->
    <script>
        // Тема сайта. Один файл на все страницы — и один выключатель в нём.
        //
        // Светлая тема выключена. Не удалена: палитра, ручной выбор, его протухание
        // через четыре часа и слежение за системой — всё на месте и работает. Погашена
        // только сама возможность выбрать, и возвращается она одним true вот здесь.
        //
        // Почему выключена. Схема сервера нарисована как освещённый предмет в тёмной
        // комнате: самая частая её краска светло-серая — это блики, гравировка и
        // кромки, а не корпус, и таких заливок треть от всех. В светлой теме им не на
        // чем светиться, и машина становится либо пятном на бумаге, либо туманом. Это
        // не перекраска, а второй рисунок, и до него ещё не дошли руки.
        //
        // Почему отдельным файлом, а не строкой в каждой странице. Страниц на сайте
        // три, и флаг стоял в двух из них порознь: включить светлую тему значило
        // вспомнить про все и не забыть ни одной, а забытая страница — это не «света
        // нет», это разъехавшийся сайт. Теперь правится одно место.
        //
        // В страницы вставляется сборкой, между метками THEME:BEGIN и THEME:END —
        // отдельным файлом он был четвёртым блокирующим запросом перед первым кадром,
        // а весит четыре килобайта. Правится по-прежнему одно место, это.
        //
        // Стоит в <head> и выполняется до первой отрисовки: иначе на долю секунды
        // мелькнёт не та тема.
        var THEME_CHOICE = false;

        // Пустое хранилище означает «следуй за системой», поэтому пишем туда только
        // то, что пользователь выбрал руками. Живёт этот выбор недолго и уступает
        // системе: рядом с ним лежит отметка, когда его сделали и какая тема была
        // тогда у системы. Если система с тех пор передумала — скажем, наступила ночь
        // и она ушла в тёмную — или если выбор просто отлежал свои часы, он
        // снимается, и страница снова идёт за системой.
        (function () {
            var LIFE = 4 * 60 * 60 * 1000;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            var saved = null;
            try {
                if (+localStorage.getItem('theme-at') > Date.now() - LIFE
                    && localStorage.getItem('theme-sys') === system) {
                    saved = localStorage.getItem('theme');
                } else {
                    localStorage.removeItem('theme');
                    localStorage.removeItem('theme-at');
                    localStorage.removeItem('theme-sys');
                }
            } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            // Ветка с THEME_CHOICE — единственное место, где выключение вообще
            // сказывается. Атрибут при этом ставится всегда, и этого довольно, чтобы
            // светлые правила не сработали: `:root[data-theme="light"]` не совпадёт, а
            // системное правило написано на `:root:not([data-theme])` — то есть на
            // «атрибута нет вовсе».
            document.documentElement.setAttribute('data-theme',
                THEME_CHOICE ? (saved || system) : 'dark');
            if (!THEME_CHOICE) document.documentElement.classList.add('theme-locked');
        })();
    </script>
    <!-- THEME:END -->

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const dotsEl = document.querySelector('.dots');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
        });

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();

        // The theme switch. Two states in the interface, three in meaning:
        // while localStorage is empty the page follows the system and reacts
        // to it changing on the fly.
        //
        // Это же состояние и основное: ручной выбор из него только временно
        // выводит, а потом всё возвращается само.
        const themeSwitch = document.getElementById('theme-switch');
        const systemLight = window.matchMedia('(prefers-color-scheme: light)');

        // Выбор запоминаем вместе с обстоятельствами: временем и тем, какая
        // тема была у системы в тот момент. По ним скрипт в <head> и решает,
        // жив ли ещё выбор к следующему заходу.
        function rememberTheme(theme) {
            try {
                localStorage.setItem('theme', theme);
                localStorage.setItem('theme-at', String(Date.now()));
                localStorage.setItem('theme-sys', systemLight.matches ? 'light' : 'dark');
            } catch (e) {}
        }

        function forgetTheme() {
            try {
                localStorage.removeItem('theme');
                localStorage.removeItem('theme-at');
                localStorage.removeItem('theme-sys');
            } catch (e) {}
        }

        function labelTheme(theme) {
            const text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                          : 'Светлая тема, включить тёмную';
            themeSwitch.setAttribute('aria-label', text);
            themeSwitch.setAttribute('title', text);
        }

        function setTheme(theme, animate) {
            const root = document.documentElement;
            // Transitions go on only for the duration of the change: kept on
            // permanently they would override the cards' own animations and
            // the hover highlight.
            if (animate && !prefersReducedMotion) {
                root.classList.add('theme-animating');
                window.setTimeout(() => root.classList.remove('theme-animating'), 500);
            }
            root.setAttribute('data-theme', theme);
            labelTheme(theme);
        }

        // Пока светлая выключена, слушать некого и незачем: и кнопка, и смена
        // системной темы вели бы страницу туда, где её нет. Сам код остаётся
        // написанным и рабочим — включается вместе с THEME_CHOICE.
        if (THEME_CHOICE) {
            themeSwitch.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                rememberTheme(next);
                setTheme(next, true);
            });

            // While there is no choice we follow the system, including when it is
            // switched right now without reloading the page.
            //
            // Система главнее выбора: сменила тему прямо сейчас — ручной выбор
            // снимается. Ровно то же сделал бы скрипт в <head> при следующем
            // заходе, только без перезагрузки.
            systemLight.addEventListener('change', e => {
                forgetTheme();
                setTheme(e.matches ? 'light' : 'dark', true);
            });
        }

        labelTheme(document.documentElement.getAttribute('data-theme') || 'dark');
    </script>
    <script>
        // Отметка о сборке. Три стенда с виду неотличимы, и это регулярно
        // сбивало: правка проверена — но на каком именно стенде? Строку в углу
        // собираем из метки в шапке; кто её туда положил — дело пайплайна,
        // здесь она только читается.
        (function () {
            var raw = (document.querySelector('meta[name="build"]') || {}).content || '';
            var b = {};
            raw.split(';').forEach(function (p) {
                var i = p.indexOf('=');
                if (i > 0) b[p.slice(0, i)] = p.slice(i + 1);
            });
            // Продакшен тем и отличается, что на нём отметки нет: там её стирает
            // пайплайн выкатки. Пустая метка — нечего и рисовать.
            var where = { local: 'локально', cloudflare: 'cloudflare' }[b.env];
            if (!where) return;
            var head = [where];
            if (b.ref && b.ref !== '—') head.push(b.ref);
            if (b.pr) head.push('PR #' + b.pr);

            var el = document.createElement('div');
            el.className = 'build-badge';
            el.appendChild(document.createTextNode(head.join(' · ')));

            // Хэш ведёт на pull request, если он есть, и на коммит, если нет:
            // от «вижу поломку» до «вижу диф» одно нажатие. Плюс в конце хэша
            // значит несохранённое в дереве — на коммит с ним не сошлёшься.
            if (b.sha) {
                // Разделитель здесь, а не в конце шапки: без штампа хэша нет
                // вовсе, и точка повисала бы в воздухе — «локально · ».
                el.appendChild(document.createTextNode(' · '));
                var a = document.createElement('a');
                a.textContent = b.sha;
                a.href = 'https://github.com/' + (b.repo || 'CosmDandy/cosmdandy.dev')
                    + (b.pr ? '/pull/' + b.pr : '/commit/' + b.sha.replace('+', ''));
                a.target = '_blank';
                a.rel = 'noopener';
                el.appendChild(a);
            }

            // Дату разворачиваем в часовом поясе смотрящего: она отвечает на
            // «насколько это свежее», а этот вопрос всегда про своё время.
            if (b.at) {
                var d = new Date(b.at);
                if (!isNaN(d)) {
                    var p2 = function (n) { return String(n).padStart(2, '0'); };
                    el.appendChild(document.createTextNode(' · '
                        + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear()
                        + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())));
                }
            }
            document.body.appendChild(el);
        })();
    </script>
    <!-- Мерки скорости от живого гостя. Исходник — tools/rum.js,
         вставляется сборкой: отдельным файлом это был бы лишний запрос
         ради трёх килобайт. Отправляются на выгрузке, только с боевого
         домена. -->
    <!-- RUM:BEGIN -->
    <script>
        // Сколько страница стоила настоящему гостю.
        //
        // Лабораторная мерка (tools/perf-matrix.mjs) меряет контейнер разработки с
        // эмуляцией телефона: она отвечает на вопрос «стало ли хуже, чем вчера», и
        // отвечает точно. Чего она не знает — какой на самом деле телефон, какая
        // сеть и сколько до ближайшего края сети. Это знает только сам гость.
        //
        // Почему свой сборщик, а не библиотека. Готовые считают пять метрик Web
        // Vitals, из которых на этой странице две не существуют: LCP не наступает
        // вовсе — его кандидатами Chrome считает картинки и текстовые блоки, а вся
        // схема это inline <svg>; на узком экране не наступает и FCP. Библиотека
        // молчала бы там, где интереснее всего, и весила бы три килобайта ради этого
        // молчания.
        //
        // Отправляется всё одним пакетом на выгрузке страницы: раньше отправлять
        // нечего — метрики дозревают по ходу, — а позже уже некому.
        (function () {
            // Отправляем только с продакшена: на localhost и превью-стендах мерки
            // врут (сеть своя, процессор свой) и только засоряют журнал.
            //
            // Продакшен опознаётся отсутствием отметки о сборке — тем же признаком,
            // по которому в проекте показывается панель слоёв. Пайплайн стирает
            // содержимое отметки только на боевом стенде. Домен здесь не годится:
            // записанный числом, он молча перестал бы работать при переезде, а
            // отметка ставится тем же, кто разворачивает.
            // Тег обязан быть и обязан быть пустым. «Нет тега» — это не продакшен,
            // а страница, которую забыли проштамповать: мягкая проверка пускала бы
            // мерки с localhost и с каждого превью-стенда.
            var stamp = document.querySelector('meta[name="build"]');
            if (!stamp || stamp.content) return;
            if (!navigator.sendBeacon) return;

            var m = {};
            var sent = false;
            var nav = performance.getEntriesByType('navigation')[0];

            // Сдвиги макета копятся до самого конца: элемент, приехавший на третьей
            // секунде, сдвигает всё под собой так же, как приехавший на первой.
            var cls = 0;
            try {
                new PerformanceObserver(function (list) {
                    list.getEntries().forEach(function (e) {
                        // Сдвиг сразу после нажатия — это ответ на действие, а не
                        // рывок: гость его ожидал.
                        if (!e.hadRecentInput) cls += e.value;
                    });
                }).observe({ type: 'layout-shift', buffered: true });
            } catch (e) { /* нет поддержки — метрики просто не будет */ }

            // Отзывчивость: самое долгое ожидание ответа на действие за весь визит.
            // Это упрощённый INP — настоящий берёт 98-й процентиль, но на визитке
            // взаимодействий единицы, и худшее из них честнее процентиля по трём.
            var inp = 0;
            try {
                new PerformanceObserver(function (list) {
                    list.getEntries().forEach(function (e) {
                        if (e.duration > inp) inp = e.duration;
                    });
                }).observe({ type: 'event', durationThreshold: 16, buffered: true });
            } catch (e) { /* то же самое */ }

            function send() {
                // Один визит — одна мерка. Отправку зовут два события, и `once` на
                // каждом снимает только свой обработчик: в журнал уезжало по две
                // одинаковые записи на визит, и лента, по которой сравнивают «до и
                // после выкатки», была вдвое гуще правды.
                if (sent || !nav) return;
                sent = true;
                m.ttfb = nav.responseStart;
                m.dcl = nav.domContentLoadedEventEnd;
                m.load = nav.loadEventEnd;
                var paint = performance.getEntriesByName('first-contentful-paint')[0];
                if (paint) m.fcp = paint.startTime;
                var lcp = performance.getEntriesByType('largest-contentful-paint').pop();
                if (lcp) m.lcp = lcp.startTime;
                if (cls) m.cls = cls;
                if (inp) m.inp = inp;

                var conn = navigator.connection || {};
                navigator.sendBeacon('/rum', JSON.stringify({
                    m: m,
                    // Вид решает ширина, и он же решает, за что гость заплатил: на
                    // узком экране схемы нет, а её вес приезжает.
                    v: document.body.classList.contains('view-rig') ? 'rig' : 'card',
                    w: innerWidth,
                    n: conn.effectiveType || null,
                    // Тёплый заход: по проводу приехало меньше, чем страница весит.
                    // Нулём это не опознать — с тех пор как воркер ставит метку
                    // версии, повторный заход отвечает 304, а у него transferSize
                    // равен весу заголовков, а не нулю.
                    c: nav.transferSize > 0 && nav.transferSize < nav.decodedBodySize
                }));
            }

            // pagehide, а не unload: с ним страница остаётся пригодной для обратного
            // хода в истории, и на мобильных он единственный, который вообще
            // случается — вкладку там не закрывают, её убивают.
            addEventListener('pagehide', send);
            // Скрытие вкладки — тот же конец визита с точки зрения мерки: гость ушёл,
            // и вернуться может через час. Что сработает первым, неизвестно, и от
            // повтора защищает флаг внутри send, а не `once` на каждом слушателе.
            addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') send();
            });
