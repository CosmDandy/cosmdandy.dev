<!DOCTYPE html>
<!--
    Hi. Crafted by hand — no frameworks, no build tools.
    Source: github.com/CosmDandy/cosmdandy.dev
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Светлая тема выключена. Не удалена: палитра, ручной выбор, его
        // протухание через четыре часа и слежение за системой — всё на месте и
        // работает. Погашена только сама возможность выбрать, и возвращается
        // она одним true вот здесь. Почему — расписано в index.html.
        var THEME_CHOICE = false;

        // Before the first paint, otherwise the wrong theme flashes for a
        // fraction of a second. An empty store means "follow the system", so
        // only what the user picked by hand is written here.
        //
        // Живёт этот выбор недолго и уступает системе: рядом с ним лежит
        // отметка, когда его сделали и какая тема была тогда у системы. Если
        // система с тех пор передумала — скажем, наступила ночь и она ушла в
        // тёмную — или если выбор просто отлежал свои часы, он снимается, и
        // страница снова идёт за системой.
        (function () {
            var LIFE = 4 * 60 * 60 * 1000;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            var saved = null;
            try {
                if (+localStorage.getItem('theme-at') > Date.now() - LIFE
                    && localStorage.getItem('theme-sys') === system) {
                    saved = localStorage.getItem('theme');
                } else {
                    localStorage.removeItem('theme');
                    localStorage.removeItem('theme-at');
                    localStorage.removeItem('theme-sys');
                }
            } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            // Атрибут ставится всегда, и этого довольно, чтобы светлые правила
            // не сработали: `:root[data-theme="light"]` не совпадёт, а
            // системное написано на `:root:not([data-theme])`.
            document.documentElement.setAttribute('data-theme',
                THEME_CHOICE ? (saved || system) : 'dark');
            if (!THEME_CHOICE) document.documentElement.classList.add('theme-locked');
        })();
    </script>
    <title>404 · Timofey Kondrashin</title>
    <meta name="description" content="Page not found">
    <!-- Пока светлая выключена, полоса браузера тоже держится тёмной: её
         выбирает система, а не наша тема. Светлые значения возвращаются
         вместе с темой:
             <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
             <meta name="color-scheme" content="dark light"> -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <!-- Отметка о сборке: какой стенд, из чего собран и когда развёрнут.
         Значение ставит тот пайплайн, который развёртывает (tools/stamp_build.py),
         локально — sync.sh. Здесь стоит то, что видно, если не ставил никто. -->
    <meta name="build" content="env=local;repo=CosmDandy/cosmdandy.dev;ref=master;sha=6dff26e+;at=2026-08-07T23:00:25Z">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found-bg {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10rem, 32vw, 26rem);
            font-weight: 600;
            color: var(--ghost);
            letter-spacing: -0.06em;
            line-height: 1;
            text-align: center;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: contentEnter 1s cubic-bezier(0.32, 0.72, 0, 1) backwards;
        }

        @media (max-width: 480px) {
            .not-found-bg {
                align-items: flex-start;
                padding-top: 15vh;
                color: var(--ghost-mobile);
                letter-spacing: -0.02em;
                transform: translateZ(0) scaleY(1.5);
                transform-origin: top center;
                -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
                mask-image: linear-gradient(to top, black 60%, transparent 100%);
            }
        }

        .not-found-message {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.78rem;
            color: var(--now);
            margin-bottom: 32px;
            letter-spacing: 0.01em;
            line-height: 1.55;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: contentEnter 0.65s cubic-bezier(0.32, 0.72, 0, 1) 80ms backwards;
        }

        .meta-404 {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }
    </style>
</head>
<body>
    <button class="theme-switch" id="theme-switch" type="button"
            aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 4.9 4.9M19.1 19.1l-1.6-1.6M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7Z"/>
        </svg>
    </button>

    <div class="dots"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="not-found-bg">404</div>

    <main>
        <div class="card">
            <div class="glow"></div>
            <p class="not-found-message">We can't reach this part of the network right now.</p>
            <nav class="links">
                <a href="/" class="link-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    <span>Head home or stay a while</span>
                </a>
            </nav>
        </div>
    </main>

    <footer class="meta meta-404">
        <span>error 404</span>
        <span class="meta-sep">·</span>
        <a href="/">head home</a>
        <span class="meta-sep">·</span>
        <span>not found</span>
    </footer>

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const dotsEl = document.querySelector('.dots');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
        });

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();

        // The theme switch. Two states in the interface, three in meaning:
        // while localStorage is empty the page follows the system and reacts
        // to it changing on the fly.
        //
        // Это же состояние и основное: ручной выбор из него только временно
        // выводит, а потом всё возвращается само.
        const themeSwitch = document.getElementById('theme-switch');
        const systemLight = window.matchMedia('(prefers-color-scheme: light)');

        // Выбор запоминаем вместе с обстоятельствами: временем и тем, какая
        // тема была у системы в тот момент. По ним скрипт в <head> и решает,
        // жив ли ещё выбор к следующему заходу.
        function rememberTheme(theme) {
            try {
                localStorage.setItem('theme', theme);
                localStorage.setItem('theme-at', String(Date.now()));
                localStorage.setItem('theme-sys', systemLight.matches ? 'light' : 'dark');
            } catch (e) {}
        }

        function forgetTheme() {
            try {
                localStorage.removeItem('theme');
                localStorage.removeItem('theme-at');
                localStorage.removeItem('theme-sys');
            } catch (e) {}
        }

        function labelTheme(theme) {
            const text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                          : 'Светлая тема, включить тёмную';
            themeSwitch.setAttribute('aria-label', text);
            themeSwitch.setAttribute('title', text);
        }

        function setTheme(theme, animate) {
            const root = document.documentElement;
            // Transitions go on only for the duration of the change: kept on
            // permanently they would override the cards' own animations and
            // the hover highlight.
            if (animate && !prefersReducedMotion) {
                root.classList.add('theme-animating');
                window.setTimeout(() => root.classList.remove('theme-animating'), 500);
            }
            root.setAttribute('data-theme', theme);
            labelTheme(theme);
        }

        // Пока светлая выключена, слушать некого и незачем: и кнопка, и смена
        // системной темы вели бы страницу туда, где её нет. Сам код остаётся
        // написанным и рабочим — включается вместе с THEME_CHOICE.
        if (THEME_CHOICE) {
            themeSwitch.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                rememberTheme(next);
                setTheme(next, true);
            });

            // While there is no choice we follow the system, including when it is
            // switched right now without reloading the page.
            //
            // Система главнее выбора: сменила тему прямо сейчас — ручной выбор
            // снимается. Ровно то же сделал бы скрипт в <head> при следующем
            // заходе, только без перезагрузки.
            systemLight.addEventListener('change', e => {
                forgetTheme();
                setTheme(e.matches ? 'light' : 'dark', true);
            });
        }

        labelTheme(document.documentElement.getAttribute('data-theme') || 'dark');
    </script>
    <script>
        // Отметка о сборке. Три стенда с виду неотличимы, и это регулярно
        // сбивало: правка проверена — но на каком именно стенде? Строку в углу
        // собираем из метки в шапке; кто её туда положил — дело пайплайна,
        // здесь она только читается.
        (function () {
            var raw = (document.querySelector('meta[name="build"]') || {}).content || '';
            var b = {};
            raw.split(';').forEach(function (p) {
                var i = p.indexOf('=');
                if (i > 0) b[p.slice(0, i)] = p.slice(i + 1);
            });
            // Продакшен тем и отличается, что на нём отметки нет: там её стирает
            // пайплайн выкатки. Пустая метка — нечего и рисовать.
            var where = { local: 'локально', cloudflare: 'cloudflare' }[b.env];
            if (!where) return;
            var head = [where];
            if (b.ref && b.ref !== '—') head.push(b.ref);
            if (b.pr) head.push('PR #' + b.pr);

            var el = document.createElement('div');
            el.className = 'build-badge';
            el.appendChild(document.createTextNode(head.join(' · ')));

            // Хэш ведёт на pull request, если он есть, и на коммит, если нет:
            // от «вижу поломку» до «вижу диф» одно нажатие. Плюс в конце хэша
            // значит несохранённое в дереве — на коммит с ним не сошлёшься.
            if (b.sha) {
                // Разделитель здесь, а не в конце шапки: без штампа хэша нет
                // вовсе, и точка повисала бы в воздухе — «локально · ».
                el.appendChild(document.createTextNode(' · '));
                var a = document.createElement('a');
                a.textContent = b.sha;
                a.href = 'https://github.com/' + (b.repo || 'CosmDandy/cosmdandy.dev')
                    + (b.pr ? '/pull/' + b.pr : '/commit/' + b.sha.replace('+', ''));
                a.target = '_blank';
                a.rel = 'noopener';
                el.appendChild(a);
            }

            // Дату разворачиваем в часовом поясе смотрящего: она отвечает на
            // «насколько это свежее», а этот вопрос всегда про своё время.
            if (b.at) {
                var d = new Date(b.at);
                if (!isNaN(d)) {
                    var p2 = function (n) { return String(n).padStart(2, '0'); };
                    el.appendChild(document.createTextNode(' · '
                        + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear()
                        + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())));
                }
            }
            document.body.appendChild(el);
        })();
    </script>
</body>
</html>
