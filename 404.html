<!DOCTYPE html>
<!--
    Hi. Crafted by hand — no frameworks, no build tools.
    Source: github.com/CosmDandy/cosmdandy.dev
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // До отрисовки, иначе на долю секунды мелькнёт не та тема.
        (function () {
            var t = 'auto';
            try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
            if (['auto', 'light', 'dark'].indexOf(t) === -1) t = 'auto';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>404 — Timofey Kondrashin</title>
    <meta name="description" content="Page not found">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found-bg {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10rem, 32vw, 26rem);
            font-weight: 600;
            color: var(--ghost);
            letter-spacing: -0.06em;
            line-height: 1;
            text-align: center;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: contentEnter 1s cubic-bezier(0.32, 0.72, 0, 1) backwards;
        }

        @media (max-width: 480px) {
            .not-found-bg {
                align-items: flex-start;
                padding-top: 15vh;
                color: var(--ghost-mobile);
                letter-spacing: -0.02em;
                transform: translateZ(0) scaleY(1.5);
                transform-origin: top center;
                -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
                mask-image: linear-gradient(to top, black 60%, transparent 100%);
            }
        }

        .not-found-message {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.78rem;
            color: var(--now);
            margin-bottom: 32px;
            letter-spacing: 0.01em;
            line-height: 1.55;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: contentEnter 0.65s cubic-bezier(0.32, 0.72, 0, 1) 80ms backwards;
        }

        .meta-404 {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }
    </style>
</head>
<body>
    <button class="theme-switch" id="theme-switch" type="button"
            aria-label="Тема: по системе" title="Тема: по системе">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
                <linearGradient id="themeStarGrad" x1="22%" y1="100%" x2="78%" y2="0%">
                    <stop offset="0%" stop-color="#ee5c80"/>
                    <stop offset="25%" stop-color="#ee76a8"/>
                    <stop offset="50%" stop-color="#9452cd"/>
                    <stop offset="75%" stop-color="#34cdeb"/>
                    <stop offset="100%" stop-color="#32eeeb"/>
                </linearGradient>
            </defs>
            <g class="ray" stroke-width="0.9" fill="none">
                <line x1="12" y1="12" x2="12" y2="4"/><line x1="12" y1="12" x2="18.9" y2="8"/>
                <line x1="12" y1="12" x2="18.9" y2="16"/><line x1="12" y1="12" x2="12" y2="20"/>
                <line x1="12" y1="12" x2="5.1" y2="16"/><line x1="12" y1="12" x2="5.1" y2="8"/>
            </g>
            <g class="node">
                <circle cx="12" cy="4" r="1.25"/><circle cx="18.9" cy="8" r="1.25"/>
                <circle cx="18.9" cy="16" r="1.25"/><circle cx="12" cy="20" r="1.25"/>
                <circle cx="5.1" cy="16" r="1.25"/><circle cx="5.1" cy="8" r="1.25"/>
            </g>
            <path class="star" fill="url(#themeStarGrad)"
                  d="M12 6.6 C12.45 10.15 13.85 11.55 17.4 12 C13.85 12.45 12.45 13.85 12 17.4 C11.55 13.85 10.15 12.45 6.6 12 C10.15 11.55 11.45 10.15 12 6.6 Z"/>
        </svg>
    </button>

    <div class="dots"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="not-found-bg">404</div>

    <main>
        <div class="card">
            <div class="glow"></div>
            <p class="not-found-message">We can't reach this part of the network right now.</p>
            <nav class="links">
                <a href="/" class="link-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    <span>Head home or stay a while</span>
                </a>
            </nav>
        </div>
    </main>

    <footer class="meta meta-404">
        <span>error 404</span>
        <span class="meta-sep">·</span>
        <a href="/">head home</a>
        <span class="meta-sep">·</span>
        <span>not found</span>
    </footer>

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const dotsEl = document.querySelector('.dots');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
        });

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();

        // Переключатель темы: auto → light → dark по кругу.
        const THEMES = ['auto', 'light', 'dark'];
        const THEME_LABELS = { auto: 'по системе', light: 'светлая', dark: 'тёмная' };
        const themeSwitch = document.getElementById('theme-switch');

        function labelTheme(theme) {
            const text = 'Тема: ' + THEME_LABELS[theme];
            themeSwitch.setAttribute('aria-label', text);
            themeSwitch.setAttribute('title', text);
        }

        themeSwitch.addEventListener('click', () => {
            const now = document.documentElement.getAttribute('data-theme') || 'auto';
            const next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            labelTheme(next);
        });

        labelTheme(document.documentElement.getAttribute('data-theme') || 'auto');
    </script>
</body>
</html>
