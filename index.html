        // Пустое хранилище означает «следуй за системой», поэтому пишем сюда
        // только то, что пользователь выбрал руками.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', saved || system);

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const linkItems = document.querySelectorAll('.link-item:not(.disabled)');
        const dotsEl = document.querySelector('.dots');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const gradientStops = [
            { pos: 0,    r: 255, g: 50,  b: 100 },
            { pos: 0.25, r: 255, g: 80,  b: 150 },
            { pos: 0.50, r: 120, g: 40,  b: 220 },
            { pos: 0.75, r: 0,   g: 220, b: 255 },
            { pos: 1,    r: 0,   g: 255, b: 255 }
        ];

        function sampleGradient(t) {
            t = Math.max(0, Math.min(1, t));
            for (let i = 0; i < gradientStops.length - 1; i++) {
                const a = gradientStops[i], b = gradientStops[i + 1];
                if (t >= a.pos && t <= b.pos) {
                    const f = (t - a.pos) / (b.pos - a.pos);
                    return {
                        r: Math.round(a.r + (b.r - a.r) * f),
                        g: Math.round(a.g + (b.g - a.g) * f),
                        b: Math.round(a.b + (b.b - a.b) * f)
                    };
                }
            }
            const last = gradientStops[gradientStops.length - 1];
            return { r: last.r, g: last.g, b: last.b };
        }

        function getDiagT(x, y) {
            const nav = document.querySelector('.links');
            const navRect = nav.getBoundingClientRect();
            const nx = (x - navRect.left) / navRect.width;
            const ny = (y - navRect.top) / navRect.height;
            return (nx + ny) / 2;
        }

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
            updateProximityGlow(e.clientX, e.clientY);
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
            linkItems.forEach(item => {
                item.style.removeProperty('--proximity-border');
                item.style.boxShadow = '';
            });
        });

        function updateProximityGlow(mx, my) {
            linkItems.forEach(item => {
                const rect = item.getBoundingClientRect();
                const closestX = Math.max(rect.left, Math.min(mx, rect.right));
                const closestY = Math.max(rect.top, Math.min(my, rect.bottom));
                const dist = Math.hypot(mx - closestX, my - closestY);
                const threshold = 200;
                const isHovering = mx >= rect.left && mx <= rect.right && my >= rect.top && my <= rect.bottom;

                if (dist < threshold || isHovering) {
                    const intensity = isHovering ? 1 : 1 - dist / threshold;
                    const alphaLow = (intensity * 0.06).toFixed(2);
                    const borderAlpha = (intensity * 0.2).toFixed(2);

                    const tl = sampleGradient(getDiagT(rect.left, rect.top));
                    const br = sampleGradient(getDiagT(rect.right, rect.bottom));
                    const cm = sampleGradient(getDiagT(rect.left + rect.width / 2, rect.top + rect.height / 2));

                    // Базовая тень и кромка берутся из переменных темы: на светлой
                    // чёрные тени из тёмной выглядели бы грязным пятном. Меняется
                    // только цветное свечение — оно считается от градиента.
                    if (isHovering) {
                        item.style.boxShadow = `0 0 0 1px var(--card-ring-hover), var(--card-shadow-hover), 0 0 40px -8px rgba(${cm.r}, ${cm.g}, ${cm.b}, 0.07)`;
                    } else {
                        item.style.boxShadow = `0 0 0 1px var(--card-ring), var(--card-shadow), 0 0 ${16 + intensity * 24}px -8px rgba(${cm.r}, ${cm.g}, ${cm.b}, ${alphaLow})`;
                    }

                    item.style.setProperty('--proximity-border',
                        `linear-gradient(225deg, rgba(${tl.r}, ${tl.g}, ${tl.b}, ${borderAlpha}), rgba(${br.r}, ${br.g}, ${br.b}, ${borderAlpha}))`
                    );
                } else {
                    item.style.removeProperty('--proximity-border');
                    item.style.boxShadow = '';
                }
            });
        }

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();

        document.querySelectorAll('.link-copy').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                const value = link.dataset.copy;
                const span = link.querySelector('span');
                const original = span.textContent;

                navigator.clipboard.writeText(value).then(() => {
                    span.textContent = 'Copied';
                    link.classList.add('copied');
                    setTimeout(() => {
                        span.textContent = original;
                        link.classList.remove('copied');
                    }, 1500);
                });
            });
        });

        // Переключатель темы. Два состояния в интерфейсе, три по смыслу:
        // пока в localStorage пусто, страница следует за системой и реагирует
        // на её смену на лету.
        const themeSwitch = document.getElementById('theme-switch');
        const systemLight = window.matchMedia('(prefers-color-scheme: light)');

        function savedTheme() {
            try {
                const v = localStorage.getItem('theme');
                return v === 'light' || v === 'dark' ? v : null;
            } catch (e) {
                return null;
            }
        }

        function labelTheme(theme) {
            const text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                          : 'Светлая тема, включить тёмную';
            themeSwitch.setAttribute('aria-label', text);
            themeSwitch.setAttribute('title', text);
        }

        function setTheme(theme, animate) {
            const root = document.documentElement;
            // Переходы включаем только на время смены: постоянные перебили бы
            // собственные анимации карточек и подсветку при наведении.
            if (animate && !prefersReducedMotion) {
                root.classList.add('theme-animating');
                window.setTimeout(() => root.classList.remove('theme-animating'), 500);
            }
            root.setAttribute('data-theme', theme);
            labelTheme(theme);
        }

        themeSwitch.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem('theme', next); } catch (e) {}
            setTheme(next, true);
        });

        // Пока выбора нет — идём за системой, в том числе если её сменили
        // прямо сейчас, не перезагружая страницу.
        systemLight.addEventListener('change', e => {
            if (!savedTheme()) setTheme(e.matches ? 'light' : 'dark', true);
        });

        labelTheme(document.documentElement.getAttribute('data-theme') || 'dark');
    </script>
