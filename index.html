<body>

            <nav class="links">

                    <span>CV</span>
                </a>
                <a href="https://github.com/cosmdandy" class="link-item" target="_blank" rel="noopener">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>

            </nav>
        </div>
    </main>

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const linkItems = document.querySelectorAll('.link-item:not(.disabled)');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
            updateProximityGlow(e.clientX, e.clientY);
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
            linkItems.forEach(item => {
                item.style.borderImage = '';
                item.style.boxShadow = '';
            });
        });

        function updateProximityGlow(mx, my) {
            linkItems.forEach(item => {
                const rect = item.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(mx - cx, my - cy);
                const threshold = 200;
                const isHovering = mx >= rect.left && mx <= rect.right && my >= rect.top && my <= rect.bottom;

                if (dist < threshold && !isHovering) {
                    const intensity = 1 - dist / threshold;
                    const angle = Math.atan2(my - cy, mx - cx) * (180 / Math.PI);
                    const alpha = (intensity * 0.7).toFixed(2);
                    const alphaLow = (intensity * 0.15).toFixed(2);

                    item.style.borderColor = 'transparent';
                    item.style.borderTopColor = 'transparent';
                    item.style.background = `linear-gradient(180deg, rgba(7, 54, 66, 0.25) 0%, rgba(7, 54, 66, 0.10) 100%)`;

                    const shadowGlow = `0 0 0 1px rgba(147, 161, 161, 0.04), 0 4px 24px -4px rgba(0, 20, 25, 0.6), 0 0 ${20 + intensity * 40}px -5px rgba(220, 50, 47, ${alphaLow})`;
                    item.style.boxShadow = shadowGlow;

                    const relX = ((mx - rect.left) / rect.width * 100).toFixed(0);
                    const relY = ((my - rect.top) / rect.height * 100).toFixed(0);
                    item.style.borderImage = `radial-gradient(circle at ${relX}% ${relY}%, rgba(220, 50, 47, ${alpha}), rgba(203, 75, 22, ${(intensity * 0.2).toFixed(2)}) 50%, transparent 80%) 1`;
                } else if (!isHovering) {
                    item.style.borderImage = '';
                    item.style.borderColor = '';
                    item.style.borderTopColor = '';
                    item.style.boxShadow = '';
                    item.style.background = '';
                }
            });
        }

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
